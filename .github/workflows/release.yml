# Desc:    Builds the RP2350 firmware and publishes a GitHub Release
#          with the uf2 binary whenever a "v*" tag is pushed.
# Created: 2026

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Checkout Pico SDK
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: 2.2.0
          path: pico-sdk
          submodules: recursive

      - name: Install Arm GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "14.2.Rel1"

      - name: Install Python dependencies
        run: python3 -m pip install --quiet pyserial

      - name: Configure
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_MAKE_PROGRAM=ninja \
            -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350-arm-s

      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
        run: cmake --build build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/access_gate_app.uf2
          generate_release_notes: true